services:
  postgres:
    image: postgres:16-alpine
    container_name: aiworkflowtool-postgres
    restart: unless-stopped
    environment:
      # Local dev credentials only — not secrets, safe to commit. Real
      # secrets (ANTHROPIC_API_KEY etc.) live in backend/.env, gitignored.
      POSTGRES_USER: aiworkflowtool
      POSTGRES_PASSWORD: aiworkflowtool_dev_password
      POSTGRES_DB: aiworkflowtool
    ports:
      - "5432:5432"   # host:container — lets the backend, running on your
                       # machine (not in Docker), reach Postgres via localhost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiworkflowtool"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aiworkflowtool-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
